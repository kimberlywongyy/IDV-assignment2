            <h2>014 - Seaborn Hierarchy</h2>
            <svg width="633" height="457" viewBox="0 0 633 457">
                <rect x="0" y="0" width="633" height="457" fill="white"></rect>
                <!--
                  Layout constants (all px, derived from sketch: x=8, y=24.625x≈197, z=9)
                  horizontalMargin=11(canvas edge -> column 1 left)
                  gap,x=8(between columns)
                  headercolWidth,y=197(header box width = y)
                  verticalMargin=48(canvas top -> header top = 5.3z)
                  headerHeight=120(header box height = 13.3z)
                  headerToChild=18(header bottom -> first child top = 2z)
                  childHeight=32(one child box height = 3.6z)
                  childGap,z=9(between child boxes = 1z)
                  childcolWidth=149(child box width = 18.625x, centred under header)
                -->
                <g class="col1-014">
                    <!-- column 1 plot -->
                    <g>
                        <line x1="110" y1="168" x2="110" y2="227"></line>
                        <!-- header box -->
                        <rect x="11" y="48" width="197" height="120" rx="25"></rect>

                            <tspan x="109" y="99">relplot</tspan>
                            <tspan x="109" dy="25">(relational)</tspan>
                        </text>
                    </g>
                    <g>
                        <!-- child box scatterplot x=11+(197-149)/2 = 35, y = 48+120+18 = 186-->
                        <rect x="35" y="186" width="149" height="32" rx="10"></rect>
                        <text class="childtext" x="35" y="186" dx="75" dy="16">scatterplot</text>
                    </g>
                    <g>

        <section>
            <h2>003 - Growth Curves</h2>
            <svg id="graph" width="800" height="600" viewBox="0 0 800 600"></svg>
        </section>
        <script>
            // generate x values to input into the various functions, 101 values inclusive of 0.01 and 10
            let xValues = [];
            let step = 0.01;
            for(let x = 0.01; x <= 10; x += step){
                xValues.push(x);
            }

            // sets up the y values as an array iaw the formula within the brackets
            let yLinear = xValues.map(x => x);
            let yCubic = xValues.map(x => x*x*x);
            let yQuadratic = xValues.map(x => x*x);
            let yExp = xValues.map(x => Math.pow(2,x));
            let yLog = xValues.map(x => Math.log(x));
            let yLogLinear = xValues.map(x => x * Math.log(x));

            const marginLeft = 60;
            const marginTop = 20;
            const marginRight = 20;
            const marginBottom = 50;
            const plotWidth = 720;
            const plotHeight = 530;
                
            function xToPixelX (x) {
                // a fraction of the x domain converted to the plotWidth in pixels
                return marginLeft + (x / 10) * plotWidth;
            }
            function yToPixelY (y){
                // accounts that y is counting from top down
                return marginTop + plotHeight - (y/50) * plotHeight;
            }

          
           const svg = document.getElementById("graph");
           
            // function to assign the x values and y values to an array and add the curve to the svg element which references the svg id="graph"
            function drawCurve(yArray, labelElement) {
                let points = [];
                for (let i = 0; i < xValues.length; i++) {
                    // loop stops when y exceeds 50
                    if (yArray[i] > 50) break;
                    // loop continues and doesn't draw if y is less than 0 i.e. negative
                    if (yArray[i] < 0) continue;
                    let x = xToPixelX(xValues[i]);
                    let y = yToPixelY(yArray[i]);
                    points.push(`${x},${y}`);
                }
               const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
                //joins the x,y pairs with spaces so the polyline can read them”
               polyline.setAttribute("points", points.join(" "));
               polyline.setAttribute("fill", "none");
               polyline.setAttribute("stroke", "black");
               polyline.setAttribute("stroke-width", "2");
                polyline.setAttribute("opacity", "0");
               svg.appendChild(polyline);
                
                const anim = document.createElementNS("http://www.w3.org/2000/svg", "animate");
                    anim.setAttribute("attributeName", "opacity");
                    anim.setAttribute("from", "0");
                    anim.setAttribute("to", "1");
                    anim.setAttribute("dur", "1s");
                    anim.setAttribute("begin", "1s");
                    anim.setAttribute("fill", "freeze");
                    polyline.appendChild(anim);

                function highlight(polyline, labelElement){
                    labelElement.setAttribute("fill", "red");
                    labelElement.setAttribute("font-size", "16");
                    polyline.setAttribute("stroke","red");
                    polyline.setAttribute("stroke-width","4");
                }
                function unhighlight(polyline, labelElement){
                    labelElement.setAttribute("fill", "black");
                    labelElement.setAttribute("font-size", "14");
                    polyline.setAttribute("stroke", "black");
                    polyline.setAttribute("stroke-width", "2");
                }
                
                polyline.addEventListener("mouseenter", () => highlight(polyline, labelElement));
                polyline.addEventListener("mouseleave", () => unhighlight(polyline, labelElement));

                labelElement.addEventListener("mouseenter", () => highlight(polyline, labelElement));
                labelElement.addEventListener("mouseleave", () => unhighlight(polyline, labelElement));
                    
            }
        

            //creates the borders of the graph
            const border = document.createElementNS("http://www.w3.org/2000/svg", "rect");
            border.setAttribute("x", marginLeft);
            border.setAttribute("y", marginTop);
            border.setAttribute("width", plotWidth);
            border.setAttribute("height", plotHeight);
            border.setAttribute("fill", "none");
            border.setAttribute("stroke", "black");
            border.setAttribute("stroke-width", "2");
            svg.appendChild(border);

            //x ticker marks
            for (let xTick = 0; xTick <= 10; xTick += 2) {
                let px = xToPixelX(xTick);
                let pyBottom = marginTop + plotHeight;
                let pyTop = marginTop;
            
                // bottom ticks
                const tickBottom = document.createElementNS("http://www.w3.org/2000/svg", "line");
                tickBottom.setAttribute("x1", px);
                tickBottom.setAttribute("y1", pyBottom);
                tickBottom.setAttribute("x2", px);
                tickBottom.setAttribute("y2", pyBottom + 5);
                tickBottom.setAttribute("stroke", "black");
                svg.appendChild(tickBottom);
            
                // top ticks
                const tickTop = document.createElementNS("http://www.w3.org/2000/svg", "line");
                tickTop.setAttribute("x1", px);
                tickTop.setAttribute("y1", pyTop);
                tickTop.setAttribute("x2", px);
                tickTop.setAttribute("y2", pyTop - 5);
                tickTop.setAttribute("stroke", "black");
                svg.appendChild(tickTop);
            
                // number label, only below the bottom ticks
                const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
                label.setAttribute("x", px);
                label.setAttribute("y", pyBottom + 20);
                label.setAttribute("text-anchor", "middle");
                label.textContent = xTick;
                svg.appendChild(label);
            }
        //y axis tickers
       for (let yTick = 0; yTick <= 50; yTick += 10) {
            let pxLeft = marginLeft;
            let pxRight = marginLeft + plotWidth;
            let py = yToPixelY(yTick);
        
            // left ticks
            const tickLeft = document.createElementNS("http://www.w3.org/2000/svg", "line");
            tickLeft.setAttribute("x1", pxLeft - 5);
            tickLeft.setAttribute("y1", py);
            tickLeft.setAttribute("x2", pxLeft);
            tickLeft.setAttribute("y2", py);
            tickLeft.setAttribute("stroke", "black");
            svg.appendChild(tickLeft);
        
            // right ticks
            const tickRight = document.createElementNS("http://www.w3.org/2000/svg", "line");
            tickRight.setAttribute("x1", pxRight);
            tickRight.setAttribute("y1", py);
            tickRight.setAttribute("x2", pxRight + 5);
            tickRight.setAttribute("y2", py);
            tickRight.setAttribute("stroke", "black");
            svg.appendChild(tickRight);
        
            // number label, only on the left side
            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", pxLeft - 10);
            label.setAttribute("y", py);
            label.setAttribute("text-anchor", "end");
            label.setAttribute("dominant-baseline", "middle");
            label.textContent = yTick;
            svg.appendChild(label);
        }
        // graphed out labels e.g. logarithmic etc.
       function drawLabel(text, x, y) {
            const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
            label.setAttribute("x", x);
            label.setAttribute("y", y);
            label.setAttribute("fill", "black");
           label.setAttribute("font-family", "sans-serif");
           label.setAttribute("font-size", "14");
            label.setAttribute("opacity",0);
            label.textContent = text;
            svg.appendChild(label);

           //animate the labels fading in 2s after page loads
           const fadeIn = document.createElementNS("http://www.w3.org/2000/svg", "animate");
           fadeIn.setAttribute("attributeName", "opacity");
           fadeIn.setAttribute("from", "0");
           fadeIn.setAttribute("to", "1");
           fadeIn.setAttribute("dur", "0.5s");
           fadeIn.setAttribute("begin", "2s");
           fadeIn.setAttribute("fill", "freeze");
           label.appendChild(fadeIn);

           return label
        }
        let labelLog = drawLabel("logarithmic", xToPixelX(8), yToPixelY(Math.log(8)) - 10);
        let labelLinear = drawLabel("linear", xToPixelX(8), yToPixelY(8) - 10);
        let labelLogLinear = drawLabel("log linear", xToPixelX(7), yToPixelY(7 * Math.log(7)) - 30);
        let labelQuad = drawLabel("quadratic", xToPixelX(6), yToPixelY(6*6) + 15);
        let labelCubic = drawLabel("cubic", xToPixelX(2.8)-30, yToPixelY(2.8*2.8*2.8) - 50);
        let labelExp = drawLabel("exponential", xToPixelX(4.5)-80, yToPixelY(Math.pow(2,4.5)) - 10);
            
        drawCurve(yLog, labelLog);
        drawCurve(yLinear, labelLinear);
        drawCurve(yLogLinear, labelLogLinear);
        drawCurve(yQuadratic, labelQuad);
        drawCurve(yCubic, labelCubic);
        drawCurve(yExp, labelExp);
        
        </script>
    </body>
