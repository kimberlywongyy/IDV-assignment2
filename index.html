<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
           .label001 { fill: black; 
                 font-family: sans-serif;
                font-size: 60px;
                 text-anchor: middle;
                pointer-events: none;
                }
            .gray {
                stroke: black;
                stroke-width: 4px;
                fill: #E1E1E1;
            }
            .gray:hover {fill: #9D9D9D;}
            .cyan{
                stroke: black;
                stroke-width: 4px;
                fill: #00FDFF;
            }
            .cyan:hover {fill: #00C0C0;}
            .pink{
                stroke: black;
                stroke-width: 4px;
                fill: #F7788A;
            }
            .pink:hover {fill: #F22A47;}
            .orange {
                stroke: black;
                stroke-width: 4px;
                fill: #FFA35F;
            }
            .orange:hover{fill:#FF7005;}
            .green{
                 stroke: black;
                stroke-width: 4px;
                fill: #78C445;
            }
            .green:hover{fill: #66AB37;}
            .week {
                stroke: black;
                stroke-width: 4px;
                fill: none;
                pointer-events: all;
            }
            .week:hover{fill:gray}
            .line001 {
                stroke: black;
                stroke-width: 4px;
                marker-end: url(#arrow001);
            }
        </style>
    </head>
    <body>
        <!-- 001 Concept Map -->
        <section>
            <h2>001 - Concept Map</h2>
            <svg width="3362" height="1717" viewBox = "0 0 3362 1717">
                <defs>
                  <marker id="arrow001" viewBox="0 0 15 10" refX="12" refY="5"
                          markerWidth="8" markerHeight="8" orient="auto">
                    <path d="M0 0 L15 5 L0 10 Z"/>
                  </marker>
                </defs>

                <!-- top level lines -->
                <g>
                    <line class ="line001" x1="1479" y1="413" x2="674" y2="897"/>
                    <line class ="line001" x1="1613" y1="413" x2="1351" y2="897"/>
                    <line class ="line001" x1="1763" y1="413" x2="2034" y2="897"/>
                    <line class ="line001" x1="1908" y1="413" x2="2706" y2="897"/>
                </g>

                <!-- bottom level lines -->
                <g> 
                    <line class ="line001" x1="453" y1="1163" x2="453" y2="1466"/>
                     <line class ="line001" x1="1279" y1="1163" x2="1279" y2="1466"/>
                     <line class ="line001" x1="2102" y1="1163" x2="2102" y2="1466"/>
                     <line class ="line001" x1="2928" y1="1163" x2="2928" y2="1466"/>
                </g>
                
                 <g>
                <!-- Rectangle at x=1341, y=156 (Width: 686, Height: 278) -->
                <rect class="gray" x="1341" y="156" width="686" height="278" rx="139"/>
                <!-- Text centered at x = 1341 + (686/2) = 1684, y = 280 -->
                <text class = "label001" x="1684" y="280">
                    <tspan x="1684" dy="0">Data Driven</tspan>
                    <tspan x="1684" dy="1.2em">World</tspan>
                </text>
                </g>

                <g>
                    <text class = "label001" x="1685" y="545">
                        learns
                    </text>
                </g>

                <g>
                <!-- Rectangle at x=110, y=900 (Width: 682, Height: 263) -->
                <rect class="cyan" x="110" y="900" width="682" height="263"/>
                <!-- Text centered at x = 110 + (682/2) = 451, y = 1020 -->
                <text class="label001" x="451" y="1020">
                    <tspan x="451" dy="0">Algorithms and Data</tspan>
                    <tspan x="451" dy="1.2em">Structures</tspan>
                </text>
                </g>

                <g>
                <!-- Rectangle at x=935, y=900 (Width: 682, Height: 263) -->
                <rect class ="pink" x="935" y="900" width="682" height="263"/>
                <!-- Text centered at x = 935 + (682/2) = 1276, y = 1020 -->
                <text class="label001" x="1276" y="1020">
                    <tspan x="1276" dy="0">Object Oriented</tspan>
                    <tspan x="1276" dy="1.2em">Programming</tspan>
                </text>
                </g>

                <g>
                <!-- Rectangle at x=1765, y=900 (Width: 682, Height: 263) -->
                <rect class = "orange" x="1765" y="900" width="682" height="263"/>
                <!-- Text centered at x = 1765 + (682/2) = 2106, y = 1040 -->
                <text class="label001" x="2106" y="1040">State Machine</text>
                </g>

                <g>
                <!-- Rectangle at x=2585, y=900 (Width: 682, Height: 263) -->
                <rect class = "green" x="2585" y="900" width="682" height="263"/>
                <!-- Text centered at x = 2585 + (682/2) = 2926, y = 1020 -->
                <text class="label001" x="2926" y="1020">
                    <tspan x="2926" dy="0">Introduction to</tspan>
                    <tspan x="2926" dy="1.2em">Machine Learning</tspan>
                </text>
                </g>

                <g>
                <!-- Rectangle at x=227, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="227" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 227 + (451/2) = 453, y = 1540 -->
                <text class="label001" x="453" y="1540">Week 1 to 6</text>
                </g>

                <g>
                <!-- Rectangle at x=1055, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="1055" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 1055 + (451/2) = 1281, y = 1540 -->
                <text class="label001" x="1281" y="1540">Week 4 to 8</text>
                </g>

                 <g>
                <!-- Rectangle at x=1878, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="1878" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 1878 + (451/2) = 2104, y = 1540 -->
                <text class="label001" x="2104" y="1540">Week 8</text>
                </g>

                 <g>
                <!-- Rectangle at x=2704, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="2704" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 2704 + (451/2) = 2930, y = 1540 -->
                <text class="label001" x="2930" y="1540">Week 9 to 11</text>
                </g>

            </svg>
        </section>
    </body>
</html>
