<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
           .label001 { fill: black; 
                 font-family: sans-serif;
                font-size: 60px;
                 text-anchor: middle;
                /* dominant-baseline: central; */
                }
            .gray {
                stroke: black;
                stroke-width: 4px;
                fill: #E1E1E1;
            }
            .gray:hover {fill: #9D9D9D;}
            .cyan{
                stroke: black;
                stroke-width: 4px;
                fill: #00FDFF;
            }
            .cyan:hover {fill: #00C0C0;}
            .pink{
                stroke: black;
                stroke-width: 4px;
                fill: #F7788A;
            }
            .pink:hover {fill: #F22A47;}
            .orange {
                stroke: black;
                stroke-width: 4px;
                fill: #FFA35F;
            }
            .orange:hover{fill:#FF7005;}
            .green{
                 stroke: black;
                stroke-width: 4px;
                fill: #78C445;
            }
            .green:hover{fill: #66AB37;}
            .week {
                stroke: black;
                stroke-width: 4px;
                fill: none;
                pointer-events: all;
            }
            .week:hover{fill:gray}
        </style>
    </head>
    <body>
        <!-- 001 Concept Map -->
        <section>
            <h2>001 - Concept Map</h2>
            <svg width="3362" height="1717" viewBox = "0 0 3362 1717">
                 <g>
                <!-- Rectangle at x=1341, y=156 (Width: 686, Height: 278) -->

                    <tspan x="1684" dy="0">Data Driven</tspan>
                    <tspan x="1684" dy="1.2em">World</tspan>

                    <text class = "label001" x="1685" y="545">
                        learns

</html>
