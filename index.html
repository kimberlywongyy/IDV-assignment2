<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
           .label001 { fill: black; 
                font-family: sans-serif;
                font-size: 60px;
                text-anchor: middle;
                pointer-events: none;
                }
            .label002{
                font-family: sans-serif;
                font-size: 15px;
                text-anchor: middle;
                dominant-baseline: central;
                pointer-events: none;
            }
            .gray {
                stroke: black;
                stroke-width: 4px;
                fill: #E1E1E1;
            }
            .gray:hover {fill: #9D9D9D;}
            .cyan{
                stroke: black;
                stroke-width: 4px;
                fill: #00FDFF;
            }
            .cyan:hover {fill: #00C0C0;}
            .pink{
                stroke: black;
                stroke-width: 4px;
                fill: #F7788A;
            }
            .pink:hover {fill: #F22A47;}
            .orange {
                stroke: black;
                stroke-width: 4px;
                fill: #FFA35F;
            }
            .orange:hover{fill:#FF7005;}
            .green{
                 stroke: black;
                stroke-width: 4px;
                fill: #78C445;
            }
            .green:hover{fill: #66AB37;}
            .week {
                stroke: black;
                stroke-width: 4px;
                fill: none;
                pointer-events: all;
            }
            .week:hover{fill:#E1E1E1;}
            .line001 {
                stroke: black;
                stroke-width: 4px;
                marker-end: url(#arrow001);
            }
            .cir002 {
                fill:white;
                stroke:black;
                stroke-width:2px;
            }
            .cir002:hover{fill:#E1E1E1;}
            .line002 {
                stroke: black;
                stroke-width: 2px;
            }
            .vertice010 circle {
                fill:none;
                stroke:black;
                stroke-width:2px;
                pointer-events:all;
            }
            .vertice010 circle:hover {fill:#E1E1E1;}
            .vertice010 text{
                font-family: sans-serif;
                font-size: 50px;
                text-anchor: middle;
                dominant-baseline: central;
                pointer-events: none;
            }
            .line010{
                stroke: black;
                stroke-width: 4px;
            }
            .line010 text{
                stroke:none;
                font-family: sans-serif;
                font-size: 50px;
                text-anchor: middle;
                dominant-baseline: central;
            }
        </style>
    </head>
    <body>
        <!-- 001 Concept Map -->
        <section>
            <h2>001 - Concept Map</h2>
            <svg width="3362" height="1717" viewBox = "0 0 3362 1717">
                <defs>
                  <marker id="arrow001" viewBox="0 0 12 10" refX="10" refY="5"
                          markerWidth="8" markerHeight="8" orient="auto">
                    <path d="M0 0 L12 5 L0 10 Z"/>
                  </marker>
                </defs>

                <!-- top level lines -->
                <g>
                    <line class ="line001" x1="1479" y1="413" x2="674" y2="897"/>
                    <line class ="line001" x1="1613" y1="413" x2="1351" y2="897"/>
                    <line class ="line001" x1="1763" y1="413" x2="2034" y2="897"/>
                    <line class ="line001" x1="1908" y1="413" x2="2706" y2="897"/>
                </g>

                <!-- bottom level lines -->
                <g> 
                    <line class ="line001" x1="453" y1="1163" x2="453" y2="1456"/>
                     <line class ="line001" x1="1279" y1="1163" x2="1279" y2="1456"/>
                     <line class ="line001" x1="2102" y1="1163" x2="2102" y2="1456"/>
                     <line class ="line001" x1="2928" y1="1163" x2="2928" y2="1456"/>
                </g>
                
                 <g>
                <!-- Rectangle at x=1341, y=156 (Width: 686, Height: 278) -->
                <rect class="gray" x="1341" y="156" width="686" height="278" rx="139"/>
                <!-- Text centered at x = 1341 + (686/2) = 1684, y = 280 -->
                <text class = "label001" x="1684" y="280">
                    <tspan x="1684" dy="0">Data Driven</tspan>
                    <tspan x="1684" dy="1.2em">World</tspan>
                </text>
                </g>

                <g>
                    <text class = "label001" x="1685" y="545">
                        learns
                    </text>
                </g>

                <g>
                <!-- Rectangle at x=110, y=900 (Width: 682, Height: 263) -->
                <rect class="cyan" x="110" y="900" width="682" height="263"/>
                <!-- Text centered at x = 110 + (682/2) = 451, y = 1020 -->
                <text class="label001" x="451" y="1020">
                    <tspan x="451" dy="0">Algorithms and Data</tspan>
                    <tspan x="451" dy="1.2em">Structures</tspan>
                </text>
                </g>

                <g>
                <!-- Rectangle at x=935, y=900 (Width: 682, Height: 263) -->
                <rect class ="pink" x="935" y="900" width="682" height="263"/>
                <!-- Text centered at x = 935 + (682/2) = 1276, y = 1020 -->
                <text class="label001" x="1276" y="1020">
                    <tspan x="1276" dy="0">Object Oriented</tspan>
                    <tspan x="1276" dy="1.2em">Programming</tspan>
                </text>
                </g>

                <g>
                <!-- Rectangle at x=1765, y=900 (Width: 682, Height: 263) -->
                <rect class = "orange" x="1765" y="900" width="682" height="263"/>
                <!-- Text centered at x = 1765 + (682/2) = 2106, y = 1040 -->
                <text class="label001" x="2106" y="1040">State Machine</text>
                </g>

                <g>
                <!-- Rectangle at x=2585, y=900 (Width: 682, Height: 263) -->
                <rect class = "green" x="2585" y="900" width="682" height="263"/>
                <!-- Text centered at x = 2585 + (682/2) = 2926, y = 1020 -->
                <text class="label001" x="2926" y="1020">
                    <tspan x="2926" dy="0">Introduction to</tspan>
                    <tspan x="2926" dy="1.2em">Machine Learning</tspan>
                </text>
                </g>

                <g>
                <!-- Rectangle at x=227, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="227" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 227 + (451/2) = 453, y = 1540 -->
                <text class="label001" x="453" y="1540">Week 1 to 6</text>
                </g>

                <g>
                <!-- Rectangle at x=1055, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="1055" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 1055 + (451/2) = 1281, y = 1540 -->
                <text class="label001" x="1281" y="1540">Week 4 to 8</text>
                </g>

                 <g>
                <!-- Rectangle at x=1878, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="1878" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 1878 + (451/2) = 2104, y = 1540 -->
                <text class="label001" x="2104" y="1540">Week 8</text>
                </g>

                 <g>
                <!-- Rectangle at x=2704, y=1463 (Width: 451, Height: 115) -->
                <rect class="week" x="2704" y="1463" width="451" height="115"/>
                <!-- Text centered at x = 2704 + (451/2) = 2930, y = 1540 -->
                <text class="label001" x="2930" y="1540">Week 9 to 11</text>
                </g>

            </svg>
        </section>
        <section>
             <h2>002 - Binary Heap Tree</h2>
            <svg width="592" height="377" viewBox = "0 0 592 377">
                <!-- connecting lines -->
                <g class="line002">
                    <line x1="296" y1="56" x2="168" y2="141"></line> 
                    <line x1="296" y1="56" x2="424" y2="141"></line>
                    <line x1="168" y1="141" x2="104" y2="226"></line>
                    <line x1="168" y1="141" x2="232" y2="226"></line>
                    <line x1="424" y1="141" x2="360" y2="226"></line>
                    <line x1="424" y1="141" x2="488" y2="226"></line>
                    <line x1="104" y1="226" x2="72" y2="311"></line>
                    <line x1="104" y1="226" x2="136" y2="311"></line>
                    <line x1="232" y1="226" x2="200" y2="311"></line>
                </g>
                
                <!-- formula: pos=i-(2^L-1), x coordinate = 40+512*((pos+0.5)/2^L) y coordinate=56+85*L-->
                <g>
                    <!-- level 0 first node: pos=0-(1-1) = 0, x = 40 + 512*0.5 = 296, y=56  -->
                    <circle class="cir002" cx="296" cy="56" r="30"></circle>
                    <text class="label002" x="296" y="56">16</text>
                    <text class="label002" x="296" y="56">
                        <tspan dx="-40" dy="-10">0</tspan>
                    </text>
                </g>

                 <g>
                    <!-- level 1 first node pos=1-(2-1) = 0, x = 40 + 512*0.25 = 168, y=56+85=141  -->
                    <circle class="cir002" cx="168" cy="141" r="30"></circle>
                    <text class="label002" x="168" y="141">14</text>
                    <text class="label002" x="168" y="141">
                        <tspan dx="-40" dy="-10">1</tspan>
                    </text>
                    <!-- level 1 second node pos=2-(2-1) = 1, x = 40 + 512*0.75 = 424, y=56+85=141  -->
                    <circle class="cir002" cx="424" cy="141" r="30"></circle>
                    <text class="label002" x="424" y="141">10</text>
                    <text class="label002" x="424" y="141">
                        <tspan dx="-40" dy="-10">2</tspan>
                    </text>
                </g>

                <g>
                    <!-- level 2 first node pos=3-(4-1) = 0, x = 40 + 512*0.125 = 104, y=56+170=226  -->
                    <circle class="cir002" cx="104" cy="226" r="30"></circle>
                    <text class="label002" x="104" y="226">8</text>
                    <text class="label002" x="104" y="226">
                        <tspan dx="-40" dy="-10">3</tspan>
                    </text>
                    <!-- level 2 second node pos=4-(4-1) = 1, x = 40 + 512*0.375 = 232, y=56+170=226  -->
                    <circle class="cir002" cx="232" cy="226" r="30"></circle>
                    <text class="label002" x="232" y="226">7</text>
                    <text class="label002" x="232" y="226">
                        <tspan dx="-40" dy="-10">4</tspan>
                    </text>
                     <!-- level 2 third node pos=5-(4-1) = 2, x = 40 + 512*0.625 = 360, y=56+170=226  -->
                    <circle class="cir002" cx="360" cy="226" r="30"></circle>
                    <text class="label002" x="360" y="226">9</text>
                    <text class="label002" x="360" y="226">
                        <tspan dx="-40" dy="-10">5</tspan>
                    </text>
                     <!-- level 2 fourth node pos=6-(4-1) = 3, x = 40 + 512*0.875 = 488, y=56+170=226  -->
                    <circle class="cir002" cx="488" cy="226" r="30"></circle>
                    <text class="label002" x="488" y="226">3</text>
                    <text class="label002" x="488" y="226">
                        <tspan dx="-40" dy="-10">6</tspan>
                    </text>
                </g>

                <g>
                    <!-- level 3 first node pos=7-(8-1) = 0, x = 40 + 512*0.0625 = 72, y=56+255=311  -->
                    <circle class="cir002" cx="72" cy="311" r="30"></circle>
                    <text class="label002" x="72" y="311">2</text>
                    <text class="label002" x="72" y="311">
                        <tspan dx="-40" dy="-10">7</tspan>
                    </text>
                    <!-- level 3 second node pos=8-(8-1) = 1, x = 40 + 512*0.1875 = 136, y=56+255=311  -->
                    <circle class="cir002" cx="136" cy="311" r="30"></circle>
                    <text class="label002" x="136" y="311">4</text>
                    <text class="label002" x="136" y="311">
                        <tspan dx="-30" dy="-30">8</tspan>
                    </text>
                     <!-- level 3 third node pos=9-(8-1) = 2, x = 40 + 512*0.3125 = 200, y=56+255=311  -->
                    <circle class="cir002" cx="200" cy="311" r="30"></circle>
                    <text class="label002" x="200" y="311">1</text>
                    <text class="label002" x="200" y="311">
                        <tspan dx="-30" dy="-30">9</tspan>
                    </text>
                </g>
            </svg>
        </section>

        <section>
            <h2>010 - Directed Graph</h2>
            <svg width="1793px" height="1310" viewBox="0 0 1793 1310">
                <defs>
                  <marker id="arrow001" viewBox="0 0 12 10" refX="10" refY="5"
                          markerWidth="8" markerHeight="8" orient="auto">
                    <path d="M0 0 L12 5 L0 10 Z"/>
                  </marker>
                </defs>
                <g class="vertice010">
                   <g>
                    <!-- vertice 1 -->
                    <circle cx="777" cy="200" r="115"></circle>
                    <text x="777" y="200">V1</text>
                   </g>
                    <g>
                    <!-- vertice 2 -->
                    <circle cx="287" cy="500" r="115"></circle>
                    <text x="287" y="500">V2</text>
                   </g>
                    <g>
                    <!-- vertice 3 -->
                    <circle cx="515" cy="1068" r="115"></circle>
                    <text x="515" y="1068">V3</text>
                   </g>
                     <g>
                    <!-- vertice 4 -->
                    <circle cx="1077" cy="837" r="115"></circle>
                    <text x="1077" y="837">V4</text>
                   </g>
                   <g>
                    <!-- vertice 5 -->
                    <circle cx="1563" cy="497" r="115"></circle>
                    <text x="1563" y="497">V5</text>
                   </g>
                </g>
                <g class="line010">
                    <g>
                        <line x1="383" y1="443" x2="681" y2="258"></line>
                        <!-- E1: midpoint (532, 350), offset (-32, -51) -->
                        <text x="532" y="350" dx="-32" dy="-51">E1</text>
                    </g>
                    <line class="line010arrow"></line>
                </g>
            </svg>
        </section>
    </body>
</html>
