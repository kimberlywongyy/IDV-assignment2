<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <style>
           /* body { color: #468; font: 16px sans-serif }
            svg { border: 1px solid #888; background-color: #eee } */
        </style>
    </head>
    <body>
        <!-- 001 Concept Map -->
        <section>
            <h2>001 - Concept Map</h2>
            <svg width="1250" height="1500">
                 <g>
                <!-- Rectangle at x=500, y=0 (Width: 250, Height: 100) -->
                <rect x="500" y="0" width="250" height="80" fill="#E1E1E1" ry="35"/>
                <!-- Text centered at x = 500 + (250/2) = 625, y = 0 + (80/2) = 40 -->
                <text x="625" y="40" 
                    fill="black" 
                    font-family="sans-serif" 
                    font-size="20" 
                    text-anchor="middle" 
                    dominant-baseline="middle">
                Data Driven World
                </text>
                </g>

                <g>
                <!-- Rectangle at x=50, y=50 (Width: 300, Height: 100) -->
                <rect x="0" y="200" width="250" height="80" fill="#00FDFF"/>

                    fill="black" 
                    font-family="sans-serif" 
                    font-size="16" 
                    text-anchor="middle" 
                    dominant-baseline="middle">
                Algorithms and Data Structures
                </text>
                </g>
